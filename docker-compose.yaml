version: "3.8"

services:
  kafka:
    image: apache/kafka:4.2.0-rc4
    container_name: matchmaking.kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Multiple listeners (reachable from host + from another docker container)
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_DOCKER://:9093,CONTROLLER://:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Which listener handles controller traffic
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      # Advertise host and container addresses
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://matchmaking.kafka:9093
      # Inter-broker communication (required in KRaft multi-listener setup)
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      # single broker for development
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.2.0-rc4
    depends_on:
      - kafka
    environment:
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS}
    volumes:
      - ./infrastructure/kafka-init.sh:/kafka-init.sh
    command: sh -c "/kafka-init.sh"

  redis:
    image: redis:8.2.4
    container_name: matchmaking.redis
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --databases 2
    volumes:
      - redis-data:/data
    restart: unless-stopped

  service:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.service
    container_name: matchmaking.service
    ports:
      - "5232:8080"
    environment:
      Messaging__Kafka__Endpoint: matchmaking.kafka:9093
      Redis__ConnectionString: "matchmaking.redis:6379,defaultDatabase=0"
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_RUNNING_IN_CONTAINER: true
      BaseUrl: ${BASE_URL}
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  worker:
      build:
        context: .
        dockerfile: infrastructure/Dockerfile.worker
      environment:
        Messaging__Kafka__Endpoint: matchmaking.kafka:9093
        Redis__ConnectionString: "matchmaking.redis:6379,defaultDatabase=1"
      deploy:
        mode: replicated
        replicas: ${WORKER_REPLICAS}
      depends_on:
        redis:
          condition: service_started
        service:
          condition: service_started
        kafka:
          condition: service_started
        kafka-init:
          condition: service_completed_successfully

volumes:
  kafka-data:
  redis-data:
